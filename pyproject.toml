[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge-ai"
version = "0.1.0"
description = "A typed workflow builder and validation layer for AI-generated UiPath workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FlowForge contributors" }]
dependencies = []

[project.scripts]
flowforge = "flowforge.cli:main"

[tool.setuptools.packages.find]
include = ["flowforge*"]
